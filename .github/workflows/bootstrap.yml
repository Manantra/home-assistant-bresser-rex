name: Publish initial beta source
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract source
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03; do test -f ".bootstrap/part$n"; done
          cat .bootstrap/part0* | base64 -d > /tmp/bresser-beta.tar.xz
          echo '23d3258a90aa237087a1eede02c335514ede294ba06a4585f949a853e82324ba  /tmp/bresser-beta.tar.xz' | sha256sum -c -
          tar -tJf /tmp/bresser-beta.tar.xz | while IFS= read -r path; do
            case "$path" in
              /*|../*|*/../*|*/..|./*) echo "Unsafe archive path: $path" >&2; exit 1 ;;
            esac
          done
          tar -xJf /tmp/bresser-beta.tar.xz
          test -f custom_components/bresser_rex/manifest.json
          test -f README.md
          rm -rf .bootstrap
      - name: Publish source files
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish BRESSER REX public beta v0.2.0'
          git push origin HEAD:main
